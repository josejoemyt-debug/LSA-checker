name: Check Websites & Contact Forms

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run website & form checks
        run: npx playwright test

      - name: Upload report & screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Email result with screenshots
        if: always()
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DASH_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python3 - <<'EOF'
          import glob, os, smtplib
          from email.message import EmailMessage

          status = os.environ["STATUS"]
          icon = "✅" if status == "success" else "❌"

          msg = EmailMessage()
          msg["Subject"] = f"{icon} Site check: {status}"
          msg["From"] = os.environ["MAIL_USERNAME"]
          msg["To"] = os.environ["MAIL_TO"]
          msg.set_content(
              f"The website and contact form check finished with status: {status}.\n\n"
              f"Dashboard: {os.environ['DASH_URL']}\n"
              f"Run details: {os.environ['RUN_URL']}\n\n"
              f"Screenshots are attached."
          )

          # Attach every screenshot Playwright saved (cap total size for Gmail)
          total = 0
          for path in sorted(glob.glob("test-results/**/*.png", recursive=True)):
              size = os.path.getsize(path)
              if total + size > 20 * 1024 * 1024:
                  break
              total += size
              name = os.path.relpath(path, "test-results").replace(os.sep, "_")
              with open(path, "rb") as f:
                  msg.add_attachment(f.read(), maintype="image", subtype="png", filename=name)

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
              server.login(os.environ["MAIL_USERNAME"], os.environ["MAIL_PASSWORD"])
              server.send_message(msg)
          EOF

      - name: Update dashboard
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$REMOTE" dashboard
          else
            mkdir dashboard
            git -C dashboard init -b gh-pages
            git -C dashboard remote add origin "$REMOTE"
          fi

          node scripts/build-dashboard.js

          cd dashboard
          touch .nojekyll
          git config user.name "site-monitor-bot"
          git config user.email "site-monitor-bot@users.noreply.github.com"
          git checkout --orphan fresh
          git add -A
          git commit -m "Update dashboard"
          git push --force origin fresh:gh-pages
